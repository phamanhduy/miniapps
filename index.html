<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPilot</title>
    <script>
      // Mock Electron inside standard browser context
      if (typeof window !== 'undefined' && !window.require) {
          const listeners = new Map();

          // Connect to Server-Sent Events (SSE) for backend updates
          const sse = new EventSource('/api/events');
          sse.onmessage = (event) => {
              try {
                  const { channel, args } = JSON.parse(event.data);
                  console.log(`[Mock Electron sse] Event received: ${channel}`, args);
                  const callbacks = listeners.get(channel) || [];
                  callbacks.forEach(cb => cb(null, ...args));
              } catch (e) {
                  console.error('[Mock Electron sse] Parse error:', e);
              }
          };

          window.require = (moduleName) => {
              if (moduleName === 'electron') {
                  return {
                      ipcRenderer: {
                          invoke: async (channel, ...args) => {
                              const response = await fetch('/api/ipc', {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify({ channel, args })
                              });
                              const data = await response.json();
                              if (data.error) throw new Error(data.error);
                              return data.result;
                          },
                          send: (channel, ...args) => {
                              fetch('/api/ipc-send', {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify({ channel, args })
                              }).catch(err => console.error('[Mock Electron ipc-send] Error:', err));
                          },
                          on: (channel, callback) => {
                              if (!listeners.has(channel)) {
                                  listeners.set(channel, []);
                              }
                              listeners.get(channel).push(callback);
                          },
                          removeListener: (channel, callback) => {
                              const callbacks = listeners.get(channel) || [];
                              const index = callbacks.indexOf(callback);
                              if (index !== -1) {
                                  callbacks.splice(index, 1);
                              }
                          },
                          removeAllListeners: (channel) => {
                              listeners.delete(channel);
                          }
                      },
                      shell: {
                          openExternal: (url) => {
                              window.open(url, '_blank');
                          }
                      }
                  };
              }
              throw new Error(`Module ${moduleName} is not mocked in browser context.`);
          };
      }
    </script>
